name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        preset: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cmake --preset ${{ matrix.preset }} -DSUB0HEXGRID_BUILD_BENCHMARKS=ON
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - run: ctest --preset ${{ matrix.preset }}
      - run: ./build/${{ matrix.preset }}/benchmarks/sub0hexgrid_benchmarks
        if: matrix.preset == 'release'
  sanitize:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset sanitize
      - run: cmake --build --preset sanitize --parallel 4
      - run: ctest --preset sanitize
